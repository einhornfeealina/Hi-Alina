backend:
  name: git-gateway
  branch: main

media_folder: "media"
public_folder: "/media"

collections:
  - name: "projects"
    label: "Projekte"
    files:
      - file: "content/projects.json"
        label: "Alle Projekte"
        name: "all_projects"
        fields:
          - label: "Projekte"
            name: "projects"
            widget: "list"
            summary: "{{fields.num}} — {{fields.name}} ({{fields.cat}})"
            fields:
              - { label: "Nummer", name: "num", widget: "string", hint: "z.B. 001" }
              - label: "Kategorie"
                name: "cat"
                widget: "select"
                options:
                  - { label: "Core Projects", value: "core" }
                  - { label: "Foundations", value: "foundations" }
                  - { label: "Applied Design", value: "applied" }
                  - { label: "Writing", value: "writing" }
              - { label: "Titel", name: "name", widget: "string" }
              - { label: "Datum", name: "date", widget: "string", hint: "z.B. Nov 2025" }
              - { label: "Art der Arbeit", name: "type", widget: "string", hint: "z.B. Interactive application" }
              - { label: "Beschreibung", name: "desc", widget: "text" }
              - label: "Bilder"
                name: "images"
                widget: "list"
                required: false
                field:
                  label: "Bild-URL"
                  name: "url"
                  widget: "image"

  - name: "about"
    label: "About & Imprint"
    files:
      - file: "content/about.json"
        label: "About Text"
        name: "about"
        fields:
          - { label: "About Text", name: "text", widget: "text" }
          - { label: "Impressum Text", name: "imprint", widget: "text" }
